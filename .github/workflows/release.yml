name: Release

# Bump VERSION on main and this cuts a signed, notarized release through the
# shared shaferllc Mac release (shaferllc/.github). Run it by hand from the
# Actions tab for a dry run: build, sign, notarize and verify, publish nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run — build, sign and notarize without publishing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    uses: shaferllc/.github/.github/workflows/mac-release.yml@main
    with:
      app: Hailer
      notes: >-
        Hailer is a native macOS teleprompter in the spirit of TalkProp. Write your script, set a pace you can actually read at, and raise a floating prompter that scrolls silkily above every other window — or collapse it into a one-line ticker that tucks under your camera.
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
